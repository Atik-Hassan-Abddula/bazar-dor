
<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
>
  <title>BazarDor Favicon</title>

  <!-- Green rounded background -->
  <rect
    width="64"
    height="64"
    rx="15"
    fill="#047857"
  />

  <!-- Shopping cart -->
  <g
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M8 13h7l6 29h27l7-21H18" />
    <path d="M23 42l-3 6h29" />
  </g>

  <!-- Cart wheels -->
  <circle cx="27" cy="54" r="3.5" fill="#FFFFFF" />
  <circle cx="46" cy="54" r="3.5" fill="#FFFFFF" />

  <!-- Green leaf -->
  <path
    d="M32 17c-8 1-11 8-8 16 8 0 14-5 14-14-2-1-4-2-6-2z"
    fill="#84CC16"
  />

  <!-- Leaf vein -->
  <path
    d="M26 30l9-9"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Orange accent -->
  <path
    d="M19 14h-5"
    fill="none"
    stroke="#F59E0B"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
